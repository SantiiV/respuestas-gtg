.button {

color: black;
padding: 10px 20px;

border-radius: 4px;
font-size: 14px;
font-weight: bold;

left: 20px;

padding: 12px 24px;

left: 50%;
transform: translateX(-50%) translateY(20px);

padding: 10px 18px;

font-size: 13px;
font-weight: bold;

}
#copy-toast.show {

/* ====================== ESTADO: IDIOMA Y NOMBRE ====================== */
let currentLang = localStorage.getItem('gtgLang') || 'es';
let currentUserName = localStorage.getItem('gtgUserName') || 'Santiago';

function setLanguage(lang) {
currentLang = lang;
localStorage.setItem('gtgLang', lang);
updateLangButtons();
updateEsOnlyVisibility();
assignRowColors();
updateTitle();
}

function updateLangButtons() {
document.querySelectorAll('.lang-btn').forEach(btn => {
btn.classList.toggle('active', btn.dataset.lang === currentLang);
});
}

const TITLES = {
es: 'Respuestas GTG',
pt: 'Respuestas GTG (portugués)',
en: 'Respuestas GTG (inglés)'
};
function updateTitle() {
document.getElementById('main-title').textContent = TITLES[currentLang] || TITLES.es;
}

// Botones "es-only": promos, formas de pago locales, etc. No aplican a pasajeros extranjeros.
function updateEsOnlyVisibility() {
const hide = currentLang !== 'es';
document.querySelectorAll('.es-only').forEach(el => {
el.style.display = hide ? 'none' : '';
});
}

// Recalcula qué filas quedan realmente visibles (con al menos un botón visible)
// y les asigna el color dorado/blanco alternado según su orden VISIBLE, no según
// su número de fila fijo. Así, si una fila entera desaparece (ej. promos en PT/EN),
// no queda un espacio vacío ni se rompe el patrón de intercalación de colores.
function assignRowColors() {
const rowBlocks = document.querySelectorAll('.row-block');
let visibleIndex = 0;
rowBlocks.forEach(row => {
const buttons = row.querySelectorAll('.button');
const hasVisible = Array.from(buttons).some(btn => getComputedStyle(btn).display !== 'none');
if (!hasVisible) {
row.style.display = 'none';
return;
}
row.style.display = '';
row.classList.toggle('gold-row', visibleIndex % 2 === 1);
visibleIndex++;
});
}

function sendMsg(key, event) {
const entry = MESSAGES[key];
if (!entry) {
console.error('❌ No existe el mensaje:', key);
return;
}
let text = entry[currentLang] || entry.es;
text = text.split('{{NOMBRE}}').join(currentUserName);
navigator.clipboard.writeText(text).then(() => {
createShootingStars();
showToast();
}).catch(err => {
console.error('❌ Error al copiar:', err);
});
}

function showToast() {
const toast = document.getElementById('copy-toast');
const labels = { es: 'Copiado ✅', pt: 'Copiado ✅', en: 'Copiado ✅' };
toast.textContent = labels[currentLang] || labels.es;
toast.classList.add('show');
clearTimeout(showToast._t);
showToast._t = setTimeout(() => toast.classList.remove('show'), 1200);
}

/* ====================== VISTA PREVIA (hover) ====================== */
function showPreview(key) {
const entry = MESSAGES[key];
if (!entry) return;
let text = entry[currentLang] || entry.es;
text = text.split('{{NOMBRE}}').join(currentUserName);

const panel = document.getElementById('preview-panel');
const contentEl = document.getElementById('preview-content');
const ellipsisEl = document.getElementById('preview-ellipsis');

contentEl.textContent = text;
panel.classList.add('visible');

requestAnimationFrame(() => {
const overflowing = contentEl.scrollHeight > contentEl.clientHeight + 1;
ellipsisEl.style.display = overflowing ? 'block' : 'none';
});
}

function hidePreview() {
const panel = document.getElementById('preview-panel');
panel.classList.remove('visible');
document.getElementById('preview-content').textContent = '';
document.getElementById('preview-ellipsis').style.display = 'none';
}

// Engancha hover a cada botón leyendo la key desde su onclick existente,
// sin tener que tocar los 74 botones uno por uno.
function setupPreviewHovers() {
document.querySelectorAll('.row-block .button').forEach(btn => {
const onclickAttr = btn.getAttribute('onclick');
if (!onclickAttr) return;
const match = onclickAttr.match(/sendMsg\('([a-z0-9_]+)'/);
if (!match) return;
const key = match[1];
btn.addEventListener('mouseenter', () => showPreview(key));
btn.addEventListener('mouseleave', hidePreview);
});
}

/* ====================== MODAL DE NOMBRE ====================== */
function openNameModal() {
document.getElementById('name-modal').style.display = 'flex';
const input = document.getElementById('user-name-input');
input.value = currentUserName;
input.focus();
input.select();
}

function closeNameModal() {
document.getElementById('name-modal').style.display = 'none';
}

function saveUserName() {
const newName = document.getElementById('user-name-input').value.trim();
if (!newName) {
alert('Por favor ingresa tu nombre');
return;
}
currentUserName = newName;
localStorage.setItem('gtgUserName', newName);
closeNameModal();
const btn = document.getElementById('change-name-btn');
btn.textContent = `Nombre: ${newName}`;
setTimeout(() => {
btn.textContent = `Cambiar nombre (${newName})`;
}, 1800);
}

/* ====================== STARFIELD (sin cambios) ====================== */
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
let shootingStars = [];

function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}

function createStars() {
stars = [];
const numStars = 100;
for (let i = 0; i < numStars; i++) {
stars.push({
x: Math.random() * canvas.width,
y: Math.random() * canvas.height,
radius: Math.random() * 1.5 + 0.5,
opacity: Math.random() * 0.5 + 0.5,
vx: (Math.random() - 0.5) * 0.5,
vy: (Math.random() - 0.5) * 0.5
});
}
}

function createShootingStars() {
const numShootingStars = Math.floor(Math.random() * 3 + 3);
for (let i = 0; i < numShootingStars; i++) {
const angle = Math.random() * Math.PI * 2;
const speed = Math.random() * 3 + 3;
const x = Math.random() * canvas.width;
const y = Math.random() * canvas.height;
shootingStars.push({
x: x,
y: y,
length: 15,
opacity: 1,
vx: Math.cos(angle) * speed,
vy: Math.sin(angle) * speed,
life: 1500,
created: Date.now()
});
}
}

function drawStars() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
stars.forEach(star => {
ctx.beginPath();
ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
ctx.globalAlpha = star.opacity;
ctx.fill();
});
ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
ctx.lineWidth = 1;
shootingStars.forEach(star => {
const velocityMagnitude = Math.sqrt(star.vx * star.vx + star.vy * star.vy);
if (velocityMagnitude > 0.1) {
ctx.beginPath();
ctx.moveTo(star.x, star.y);
ctx.lineTo(
star.x - star.vx * star.length / velocityMagnitude,
star.y - star.vy * star.length / velocityMagnitude
);
ctx.globalAlpha = star.opacity;
ctx.stroke();
}
});
ctx.globalAlpha = 1.0;
}

function updateStars() {
stars.forEach(star => {
star.x += star.vx;
star.y += star.vy;
if (star.x < 0) star.x += canvas.width;
if (star.x > canvas.width) star.x -= canvas.width;
if (star.y < 0) star.y += canvas.height;
if (star.y > canvas.height) star.y -= canvas.height;
});
const now = Date.now();
shootingStars.forEach(star => {
star.x += star.vx;
star.y += star.vy;
const elapsed = now - star.created;
star.opacity = 1 - (elapsed / star.life);
if (star.opacity <= 0) star.opacity = 0;
});
shootingStars = shootingStars.filter(star => star.opacity > 0);
}

function animate() {
updateStars();
drawStars();
requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
resizeCanvas();
createStars();
});

/* ====================== INICIO ====================== */
window.addEventListener('load', () => {
resizeCanvas();
createStars();
animate();
const btn = document.getElementById('change-name-btn');
btn.textContent = `Cambiar nombre (${currentUserName})`;
updateLangButtons();
updateEsOnlyVisibility();
assignRowColors();
updateTitle();
setupPreviewHovers();
});
</script>
